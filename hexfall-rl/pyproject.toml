[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hexfall-rl"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "jsonschema",
    "gymnasium>=1.3,<2.0",
    "numpy<2.0",
    "tensorboard>=2.15",
    "tyro>=0.8",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
hexfall-random-agent = "scripts.run_random_agent:main"
hexfall-render = "hexfall.render:main"
hexfall-smoke-load = "scripts.smoke_load:main"

[tool.setuptools.packages.find]
include = ["hexfall*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]