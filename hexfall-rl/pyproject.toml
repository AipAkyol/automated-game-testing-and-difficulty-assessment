[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "hexfall-rl"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["jsonschema", "gymnasium"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
